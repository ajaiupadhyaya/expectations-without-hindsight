[project]
name = "ewh"
version = "0.1.0"
description = "Expectations Without Hindsight: noise, capability and bias in language-model forecasts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "python-calamine>=0.9.1",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "tiktoken>=0.14.0",
    "transformers>=5.22.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ewh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long Monte Carlo or dry-run tests",
    "network: needs internet access",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
